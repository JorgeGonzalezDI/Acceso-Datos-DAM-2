# --- Conexión: la MISMA base de datos Docker de la práctica 07 (puerto 3307) ---
spring.datasource.url=jdbc:mysql://localhost:3307/basededatos?serverTimezone=Europe/Madrid&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=bbdd
spring.datasource.password=bbddadmin

# Las tablas ya existen (las creó Docker): Hibernate NO las toca
spring.jpa.hibernate.ddl-auto=none
# Muestra el SQL en consola (útil para entender y para las capturas)
spring.jpa.show-sql=true
# Evita consultas "perezosas" fuera de la capa de servicio (buena práctica)
spring.jpa.open-in-view=false

server.port=8080
